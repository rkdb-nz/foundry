<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" aria-hidden="true">
  <defs>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0df"/>
      <stop offset=".06" stop-color="#aa5b31"/>
      <stop offset=".14" stop-color="#e6a16d"/>
      <stop offset=".42" stop-color="#985026"/>
      <stop offset=".72" stop-color="#d88b57"/>
      <stop offset=".92" stop-color="#7d3d1c"/>
      <stop offset="1" stop-color="#f4bd8e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".62"/>
      <stop offset=".18" stop-color="#f6f7f6" stop-opacity=".48"/>
      <stop offset=".52" stop-color="#cfd2d2" stop-opacity=".26"/>
      <stop offset=".78" stop-color="#eceeed" stop-opacity=".42"/>
      <stop offset="1" stop-color="#aeb3b4" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".96"/>
      <stop offset=".28" stop-color="#ffffff" stop-opacity=".38"/>
      <stop offset=".72" stop-color="#aeb5b7" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".74"/>
    </linearGradient>
    <linearGradient id="flare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".16" stop-color="#ffffff" stop-opacity=".74"/>
      <stop offset=".38" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d98a54" stop-opacity=".4"/>
      <stop offset="1" stop-color="#d98a54" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-15%" y="-25%" width="130%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="b"/>
      <feOffset dy="18" result="o"/>
      <feColorMatrix in="o" type="matrix" values="0 0 0 0 .18  0 0 0 0 .13  0 0 0 0 .10  0 0 0 .30 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <ellipse cx="600" cy="308" rx="515" ry="38" fill="url(#warmGlow)" filter="url(#soft)" opacity=".42"/>

  <g filter="url(#shadow)">
    <rect x="36" y="46" width="1128" height="238" rx="30" fill="url(#glass)" stroke="url(#copper)" stroke-width="5"/>
    <rect x="42" y="52" width="1116" height="226" rx="26" fill="none" stroke="#fff" stroke-opacity=".95" stroke-width="2.5"/>
    <rect x="49" y="59" width="1102" height="212" rx="22" fill="url(#glassEdge)" fill-opacity=".12" stroke="#ad6a44" stroke-opacity=".42" stroke-width="1.5"/>
    <rect x="57" y="67" width="1086" height="196" rx="18" fill="none" stroke="#fff" stroke-opacity=".56" stroke-width="2"/>

    <path d="M75 75 C175 52 305 54 421 76 C332 111 270 163 210 240 C160 254 111 253 73 246 Z" fill="url(#flare)" opacity=".9"/>
    <path d="M72 72 C95 58 126 56 158 61" fill="none" stroke="#fff" stroke-opacity=".95" stroke-width="7" stroke-linecap="round"/>
    <path d="M1047 61 C1091 59 1122 62 1141 75" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="4" stroke-linecap="round"/>
    <path d="M78 257 C325 270 861 270 1120 255" fill="none" stroke="#fff" stroke-opacity=".78" stroke-width="5" stroke-linecap="round"/>
    <path d="M142 276 C442 285 814 286 1082 274" fill="none" stroke="#d7854e" stroke-opacity=".28" stroke-width="6" stroke-linecap="round"/>
    <path d="M1098 246 C1124 239 1137 226 1144 204" fill="none" stroke="#f7c59f" stroke-opacity=".84" stroke-width="4" stroke-linecap="round"/>
    <path d="M50 173 C54 120 55 97 65 79" fill="none" stroke="#fff" stroke-opacity=".56" stroke-width="3" stroke-linecap="round"/>
    <path d="M1150 174 C1148 122 1147 96 1137 78" fill="none" stroke="#7e4328" stroke-opacity=".18" stroke-width="3" stroke-linecap="round"/>
  </g>
