<!doctype html>
<html lang="en" class="foundry-demo-shell donut-demo-shell">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Donut — Billboard demo</title>
  <link rel="stylesheet" href="../../../demo-return.css">
  <style>
    @media (max-width:900px) {
      html,
      body {
        width:100%;
        height:100%;
        height:100dvh;
        margin:0;
        overflow:hidden;
        background:#fff3ee;
      }

      .donut-demo-shell .foundry-demo-frame {
        position:fixed !important;
        inset:0 !important;
        width:100vw !important;
        height:100dvh !important;
        max-height:100dvh !important;
        border:0 !important;
        box-shadow:none !important;
      }

      .donut-demo-shell .foundry-demo-return {
        position:fixed !important;
        z-index:2147483647 !important;
        top:clamp(108px,16dvh,150px) !important;
        left:0 !important;
        width:42px !important;
        height:72px !important;
        min-height:72px !important;
        margin:0 !important;
        padding:0 !important;
        display:grid !important;
        place-items:center !important;
        border:1px solid rgba(222,111,54,.42) !important;
        border-left:0 !important;
        border-radius:0 14px 14px 0 !important;
        background:linear-gradient(145deg,#2b211b 0%,#171311 62%,#211815 100%) !important;
        box-shadow:
          0 0 0 1px rgba(222,111,54,.12),
          0 0 12px rgba(222,111,54,.42),
          4px 8px 18px rgba(0,0,0,.26) !important;
        opacity:1 !important;
        overflow:visible !important;
        animation:donut-edge-glow 2.8s ease-in-out infinite !important;
      }

      .donut-demo-shell .foundry-demo-return img {
        display:none !important;
      }

      .donut-demo-shell .foundry-demo-return::before {
        content:"‹‹" !important;
        display:block !important;
        width:auto !important;
        height:auto !important;
        background:none !important;
        border:0 !important;
        color:#df7138 !important;
        font:700 29px/1 Arial,sans-serif !important;
        letter-spacing:-7px !important;
        transform:translateX(-3px) !important;
        text-shadow:
          0 0 6px rgba(240,133,74,.72),
          0 0 14px rgba(222,111,54,.52) !important;
      }

      .donut-demo-shell .foundry-demo-return:hover,
      .donut-demo-shell .foundry-demo-return:focus-visible {
        transform:none !important;
        filter:none !important;
        outline:2px solid rgba(255,255,255,.9) !important;
        outline-offset:3px !important;
      }

      @keyframes donut-edge-glow {
        0%,100% {
          box-shadow:
            0 0 0 1px rgba(222,111,54,.12),
            0 0 10px rgba(222,111,54,.34),
            4px 8px 18px rgba(0,0,0,.26);
        }
        50% {
          box-shadow:
            0 0 0 1px rgba(240,133,74,.35),
            0 0 24px rgba(222,111,54,.78),
            4px 8px 18px rgba(0,0,0,.26);
        }
      }
    }

    @media (max-width:900px) and (prefers-reduced-motion:reduce) {
      .donut-demo-shell .foundry-demo-return {
        animation:none !important;
        box-shadow:
          0 0 0 1px rgba(240,133,74,.28),
          0 0 15px rgba(222,111,54,.52),
          4px 8px 18px rgba(0,0,0,.26) !important;
      }
    }
  </style>
